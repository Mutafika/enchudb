[package]
name = "enchudb-oplog"
version = "0.26.11"
edition = "2024"
rust-version = "1.89"   # std::fs::File::lock (#133 Windows 対応)
description = "EnchuDB oplog — append-only operation log, HLC, peer keys. Wire-level primitives shared by engine / sync / transport."
license-file = "LICENSE.md"
authors = ["mutafika"]
repository = "https://github.com/mutafika/enchudb"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

# libc は unix 限定。 flock は std::fs::File::lock 経由だが、 std が対応 target を
# 列挙で持つため Android (bionic) だけ Unsupported になる。 その穴を src/filelock.rs
# が libc::flock で塞ぐ (#280)。
[target.'cfg(all(not(target_arch = "wasm32"), unix))'.dependencies]
libc = "0.2"
