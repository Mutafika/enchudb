[package]
name = "enchudb-ngram"
version = "0.26.7"
edition = "2021"
description = "n-gram 転置インデックスの index プリミティブ。n-gram 抽出 / posting / intersect → 候補 doc id。n は index が覚える (with_n、2..=4)。検索意味論は持たない（substring 等のポリシーは enchudb-textsearch）。native は mmap、wasm は from_bytes 経由で起動。"
license-file = "LICENSE.md"
authors = ["mutafika"]
repository = "https://github.com/mutafika/enchudb"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
