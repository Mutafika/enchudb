name: CI

# 全 crate の standing test。 push / PR ごとに回り、 論理正当性・並行安全性・破損耐性・
# unsafe UB を毎回 gate する。 #95 で足した proptest / fault-injection / Miri / loom も
# ここに乗るので「一回きりの証明」ではなく永続的な回帰テストになる。
#
# test は 3 job に分ける (core の待ち時間を伸ばさない / どこが落ちたかが job 名で分かる):
#   - test          : core 5 crate (oplog / engine / schema / sql / sync)
#   - test-periphery: connect / kafka / ngram / textsearch / transport / ffi / cli / rag
#   - test-root     : root meta crate (duckdb / rusqlite bundled の重量 dev-dep を持つ)
# 以前は core 5 crate だけで、 残りは壊れても信号が出なかった (#98)。

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # core logic crate 群。 model-based proptest / fault-injection / 破壊テスト込み。
      - name: cargo test (core crates)
        run: >
          cargo test
          -p enchudb-oplog
          -p enchudb-engine
          -p enchudb-schema
          -p enchudb-sql
          -p enchudb-sync

  test-periphery:
    name: test (periphery crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # kafka の結合 test は ENCHU_KAFKA (broker) が無ければ飛ぶ。 ここでは build と単体だけ。
      - name: cargo test (periphery crates)
        run: >
          cargo test
          -p enchudb-connect
          -p enchudb-kafka
          -p enchudb-ngram
          -p enchudb-textsearch
          -p enchudb-transport
          -p enchudb-ffi
          -p enchudb-cli
          -p enchudb-rag

  test-root:
    name: test (root crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # root crate の integration test。 #213 (取り残された should_panic) はここを回して見つけた。
      - name: cargo test (root crate)
        run: cargo test -p enchudb

  miri:
    name: miri (unsafe UB)
    runs-on: ubuntu-latest
    # crossbeam-epoch 0.9 は Stacked Borrows 非互換なので Tree Borrows。
    # epoch 遅延解放の exit 時 garbage は ignore-leaks で除外。
    env:
      MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-ignore-leaks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # miri は sysroot を source から build するので rust-src が要る。
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # lock-free プリミティブの unsafe (from_raw_parts / UnsafeCell / epoch) を UB 検証。
      - name: miri append_bucket
        run: cargo miri test -p enchudb-engine --lib append_bucket
      - name: miri lockfree_cylinder (dense)
        run: cargo miri test -p enchudb-engine --lib "lockfree_cylinder::tests::dense"

  loom:
    name: loom (interleaving)
    runs-on: ubuntu-latest
    # publish protocol の全 thread interleaving を model check。
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: loom model check (AppendBucket publish)
        run: cargo test -p enchudb-engine --test loom_append_publish --release

      # #270: lazy cylinder build と並行 write の取りこぼし窓。 窓が狭すぎて実コードの
      # 統合テストでは踏めない (判定を lock の前に hoist した状態で issue95_lockfree_read
      # 5 run / issue95_stress / engine_model_proptest / issue119_retie_order_all_paths /
      # issue255_rw_open_lazy_cylinder が全 pass した)。 この model が唯一の gate。
      - name: loom model check (lazy cylinder build)
        run: cargo test -p enchudb-engine --test loom_lazy_cylinder_build --release

      # #413: 電源断 (page cache ごと失う) の模擬。 SIGKILL のテストは page cache が残るので
      # msync の漏れを通してしまう。 crashsim の hook は feature の裏なので、 ここでだけ build する。
      - name: power loss simulation (crashsim)
        run: cargo test -p enchudb-engine --features crashsim --test power_loss --release

  windows-check:
    name: check (windows cross)
    runs-on: ubuntu-latest
    # #245: 非 unix stub (segment_map_windows 等) は unix CI では compile されず、 0.23.0〜0.25.1 の
    # 5 版が Windows で build 不能のまま出た。 cross `cargo check` は target の std だけで通る
    # (link しない) ので、 Windows runner 無しで型 / メソッドの欠落を gate できる。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (core crates, x86_64-pc-windows-msvc)
        run: >
          cargo check
          --target x86_64-pc-windows-msvc
          -p enchudb-oplog
          -p enchudb-engine
          -p enchudb-schema
          -p enchudb-sql
          -p enchudb-sync

  release-check:
    name: check (release profile)
    runs-on: ubuntu-latest
    # `cfg(debug_assertions)` の付いたコードは、 debug で回る test / clippy では全部 compile される。
    # release build でだけ出る警告 / error はどこにも信号が出ない: 0.28.3 は #107 の番人 (debug build
    # だけ中身を持つ型) の field が、 release build で dead_code の警告を出したまま出た。
    # 利用者は release で build するので、 使っていないもの (`unused` の lint 群) は落とす。
    # `cargo check` は codegen しないので速い (手元で 26 秒)。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --release (workspace, -D unused)
        env:
          RUSTFLAGS: -D unused
        run: cargo check --release --workspace

  wasm-check:
    name: check (wasm cross)
    runs-on: ubuntu-latest
    # #230: wasm32 の cfg gate は native の test では compile されない。 PR #194 の初版は
    # cfg の付く位置がずれて enchudb-ngram の wasm build を壊したが、 どこにも信号が出なかった。
    # ここで守るのは **今通っている組だけ**:
    #   - wasm32-unknown-unknown: ngram / textsearch
    #   - wasm32-wasip1         : ngram / textsearch / oplog
    # engine (と、 それに依存する schema / sync / root) はどちらの target でも通らない
    # (unknown-unknown は getrandom、 wasip1 は rayon / SegmentKind)。 直すか gate を外すかは #230。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32-unknown-unknown)
        run: >
          cargo check
          --target wasm32-unknown-unknown
          -p enchudb-ngram
          -p enchudb-textsearch
      - name: cargo check (wasm32-wasip1)
        run: >
          cargo check
          --target wasm32-wasip1
          -p enchudb-ngram
          -p enchudb-textsearch
          -p enchudb-oplog

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    # 既存 #83 (region.rs slice_mut) 等の pre-existing error が残るため現状は
    # 情報提供のみ (blocking にしない)。 #83 解消後に continue-on-error を外す。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p enchudb-engine --lib --tests
